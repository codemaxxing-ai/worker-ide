name: CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'Dockerfile.computer'
      - '.dockerignore'
      - '.nvmrc'
      - 'index.html'
      - '.prettier*'
      - 'src/**'
      - 'worker/**'
      - 'shared/**'
      - 'auxiliary/**'
      - 'test/**'
      - 'public/**'
      - '.storybook/**'
      - '*.ts'
      - '*.json'
      - '*.js'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'Dockerfile.computer'
      - '.dockerignore'
      - '.nvmrc'
      - 'index.html'
      - '.prettier*'
      - 'src/**'
      - 'worker/**'
      - 'shared/**'
      - 'auxiliary/**'
      - 'test/**'
      - 'public/**'
      - '.storybook/**'
      - '*.ts'
      - '*.json'
      - '*.js'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let validated main builds reach deployment even while new work is pushed.
  # Pull requests can still discard superseded checks.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

env:
  DO_NOT_TRACK: 1
  # sudo-rs on newer Ubuntu runners ignores -E. Preserve the runner's home,
  # Docker connection, CI settings, and credentials when entering its namespaces.
  COMPUTER_PRESERVED_ENVIRONMENT: HOME,PATH,DOCKER_HOST,DOCKER_CONTEXT,XDG_RUNTIME_DIR,XDG_CONFIG_HOME,XDG_CACHE_HOME,CI,GITHUB_ACTIONS,DO_NOT_TRACK,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID,TEST_BASE_URL

jobs:
  # Keep browser libraries and the rootless container host on the validated OS.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

  knip:
    name: Knip
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Knip
        run: bun run knip

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run unit tests
        run: bun run test:unit --run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Worker tests
        run: bun run test:worker --run

  test-agent:
    name: Agent Lifecycle Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production agent lifecycle tests
        run: bun run test:agent

  test-react:
    name: React Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React tests
        run: bun run test:react --run

  test-storybook:
    name: Storybook Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(bun -p 'require("playwright/package.json").version')
          PLAYWRIGHT_PLATFORM=$(. /etc/os-release; printf '%s-%s-%s' "$ID" "$VERSION_ID" "$(uname -m)")
          echo "PLAYWRIGHT_PLATFORM=$PLAYWRIGHT_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: '~/.cache/ms-playwright'
          key: playwright-chromium-${{ steps.playwright-version.outputs.PLAYWRIGHT_PLATFORM }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Use the primary Ubuntu package mirror
        run: |
          for apt_source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$apt_source_file"
            fi
          done

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Storybook tests
        run: bun run test:storybook

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse

      - name: Set up rootless Docker for Computer
        uses: docker/setup-docker-action@v5
        env:
          # Keep dockerd in the bridge namespace shared with workerd's gateway.
          DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS: 'false'
        with:
          version: v29.9.1
          rootless: true
          set-host: true
          # GitHub runners have no user systemd session for container cgroups.
          daemon-config: |
            { "exec-opts": ["native.cgroupdriver=cgroupfs"] }

      - name: Verify Docker runtime
        run: docker info

      - name: Build pinned Computer image
        run: docker build --platform linux/amd64 -f Dockerfile.computer -t worker-ide-computer:0.4.1 .

      - name: Verify container startup and FUSE access
        run: docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined --entrypoint sh worker-ide-computer:0.4.1 -c 'test -c /dev/fuse && node --version'

      - name: Verify Docker network and DNS namespaces
        run: |
          docker_daemon_pid=$(pgrep -u "$(id -u)" -x dockerd)
          [[ "$docker_daemon_pid" =~ ^[0-9]+$ ]]
          # RootlessKit's DNS resolver lives in its copied /etc mount.
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" "$(command -v bun)" --version
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" sh -c 'test "$HOME" = "$1" && test -w "$HOME" && test "$CI" = true && docker info > /dev/null' sh "$HOME"
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" timeout 15 getent ahostsv4 api.cloudflare.com
          echo "COMPUTER_DOCKER_PID=$docker_daemon_pid" >> "$GITHUB_ENV"

      - name: Apply D1 migrations
        run: bun run db:migrate:local

      - name: Start dev server
        run: |
          for attempt in 1 2 3; do
            echo "Starting dev server (attempt $attempt/3)..."
            sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" bun run dev > "$RUNNER_TEMP/worker-ide-dev.log" 2>&1 &
            DEV_SERVER_PID=$!
            echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> "$GITHUB_ENV"

            ready=false
            for i in $(seq 1 60); do
              if ! kill -0 "$DEV_SERVER_PID" 2>/dev/null; then
                echo "Dev server process exited unexpectedly"
                break
              fi
              if sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" curl --cacert .local-certificates/_cert.pem -sf --max-time 5 https://localhost:3000/api/templates > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" = true ]; then
              echo "Server is ready!"
              break
            fi

            echo "Server did not become ready in time, killing..."
            kill "$DEV_SERVER_PID" 2>/dev/null || true
            wait "$DEV_SERVER_PID" 2>/dev/null || true
            sleep 2

            if [ "$attempt" -eq 3 ]; then
              echo "Server failed to start after 3 attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run integration tests
        timeout-minutes: 8
        run: sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" bun run test:integration
        env:
          TEST_BASE_URL: 'https://localhost:3000'

      - name: Upload integration runtime log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-runtime-log
          path: ${{ runner.temp }}/worker-ide-dev.log
          if-no-files-found: warn

      - name: Show runtime diagnostics
        if: failure()
        run: |
          head -n 100 "$RUNNER_TEMP/worker-ide-dev.log" || true
          tail -n 100 "$RUNNER_TEMP/worker-ide-dev.log" || true
          while read -r container; do
            timeout 10 docker inspect --format '{{json .State}}' "$container" || true
            timeout 10 docker logs --tail 100 "$container" || true
          done < <(timeout 10 docker ps -a --filter name=workerd-worker-ide-DurableObjectFilesystem --format '{{.ID}}')

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${DEV_SERVER_PID:-}" ]; then
            kill $DEV_SERVER_PID || true
          fi

  e2e-browsers:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(bun -p 'require("playwright/package.json").version')
          PLAYWRIGHT_PLATFORM=$(. /etc/os-release; printf '%s-%s-%s' "$ID" "$VERSION_ID" "$(uname -m)")
          echo "PLAYWRIGHT_PLATFORM=$PLAYWRIGHT_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: '~/.cache/ms-playwright'
          key: playwright-e2e-${{ matrix.browser }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_PLATFORM }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Use the primary Ubuntu package mirror
        run: |
          for apt_source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$apt_source_file"
            fi
          done

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps "${{ matrix.browser }}"

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps "${{ matrix.browser }}"

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse

      - name: Set up rootless Docker for Computer
        uses: docker/setup-docker-action@v5
        env:
          # Keep dockerd in the bridge namespace shared with workerd's gateway.
          DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS: 'false'
        with:
          version: v29.9.1
          rootless: true
          set-host: true
          # GitHub runners have no user systemd session for container cgroups.
          daemon-config: |
            { "exec-opts": ["native.cgroupdriver=cgroupfs"] }

      - name: Verify Docker runtime
        run: docker info

      - name: Build pinned Computer image
        run: docker build --platform linux/amd64 -f Dockerfile.computer -t worker-ide-computer:0.4.1 .

      - name: Verify container startup and FUSE access
        run: docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined --entrypoint sh worker-ide-computer:0.4.1 -c 'test -c /dev/fuse && node --version'

      - name: Verify Docker network and DNS namespaces
        run: |
          docker_daemon_pid=$(pgrep -u "$(id -u)" -x dockerd)
          [[ "$docker_daemon_pid" =~ ^[0-9]+$ ]]
          # RootlessKit's DNS resolver lives in its copied /etc mount.
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" "$(command -v bun)" --version
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" sh -c 'test "$HOME" = "$1" && test -w "$HOME" && test "$CI" = true && docker info > /dev/null' sh "$HOME"
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$docker_daemon_pid" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" timeout 15 getent ahostsv4 api.cloudflare.com
          echo "COMPUTER_DOCKER_PID=$docker_daemon_pid" >> "$GITHUB_ENV"

      - name: Apply D1 migrations
        run: bun run db:migrate:local

      - name: Build editor for browser tests
        run: bun run build

      - name: Start dev server
        run: |
          for attempt in 1 2 3; do
            echo "Starting dev server (attempt $attempt/3)..."
            sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" bun run dev > "$RUNNER_TEMP/worker-ide-dev.log" 2>&1 &
            DEV_SERVER_PID=$!
            echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> "$GITHUB_ENV"

            ready=false
            for i in $(seq 1 60); do
              if ! kill -0 "$DEV_SERVER_PID" 2>/dev/null; then
                echo "Dev server process exited unexpectedly"
                break
              fi
              if sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" curl --cacert .local-certificates/_cert.pem -sf --max-time 5 https://localhost:3000/api/templates > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" = true ]; then
              echo "Server is ready!"
              break
            fi

            echo "Server did not become ready in time, killing..."
            kill "$DEV_SERVER_PID" 2>/dev/null || true
            wait "$DEV_SERVER_PID" 2>/dev/null || true
            sleep 2

            if [ "$attempt" -eq 3 ]; then
              echo "Server failed to start after 3 attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run E2E tests
        id: e2e
        timeout-minutes: 12
        run: |
          sudo --preserve-env="$COMPUTER_PRESERVED_ENVIRONMENT" nsenter --target "$COMPUTER_DOCKER_PID" --net --mount --wd="$GITHUB_WORKSPACE" --setuid "$(id -u)" --setgid "$(id -g)" env "PATH=$PATH" xvfb-run --auto-servernum -- bunx playwright test --project "${{ matrix.browser }}" --reporter=line,html --max-failures=1

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        with:
          name: playwright-e2e-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/worker-ide-dev.log
          if-no-files-found: error

      - name: Show runtime diagnostics
        if: failure()
        run: |
          head -n 100 "$RUNNER_TEMP/worker-ide-dev.log" || true
          tail -n 100 "$RUNNER_TEMP/worker-ide-dev.log" || true
          while read -r container; do
            timeout 10 docker inspect --format '{{json .State}}' "$container" || true
            timeout 10 docker logs --tail 100 "$container" || true
          done < <(timeout 10 docker ps -a --filter name=workerd-worker-ide-DurableObjectFilesystem --format '{{.ID}}')

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${DEV_SERVER_PID:-}" ]; then
            kill $DEV_SERVER_PID || true
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: e2e-browsers
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: Verify all browsers passed
        run: test "${{ needs.e2e-browsers.result }}" = success
