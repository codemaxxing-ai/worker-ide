name: CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wrangler.jsonc'
      - '.nvmrc'
      - 'index.html'
      - '.prettier*'
      - 'src/**'
      - 'worker/**'
      - 'shared/**'
      - 'auxiliary/**'
      - 'test/**'
      - 'public/**'
      - '.storybook/**'
      - '*.ts'
      - '*.json'
      - '*.js'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wrangler.jsonc'
      - '.nvmrc'
      - 'index.html'
      - '.prettier*'
      - 'src/**'
      - 'worker/**'
      - 'shared/**'
      - 'auxiliary/**'
      - 'test/**'
      - 'public/**'
      - '.storybook/**'
      - '*.ts'
      - '*.json'
      - '*.js'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

env:
  DO_NOT_TRACK: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Knip
        run: bun run knip

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run unit tests
        run: bun run test:unit --run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Worker tests
        run: |
          for shard in 1 2 3 4; do
            bun run test:worker --run --shard="${shard}/4"
          done

  test-react:
    name: React Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React tests
        run: bun run test:react --run

  test-storybook:
    name: Storybook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(bun pm pkg get devDependencies.playwright)
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: '~/.cache/ms-playwright'
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Storybook tests
        run: bun run test:storybook

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations
        run: bun run db:migrate:local

      - name: Start dev server
        run: |
          for attempt in 1 2 3; do
            echo "Starting dev server (attempt $attempt/3)..."
            bun run dev &
            DEV_SERVER_PID=$!
            echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> "$GITHUB_ENV"

            ready=false
            for i in $(seq 1 60); do
              if ! kill -0 "$DEV_SERVER_PID" 2>/dev/null; then
                echo "Dev server process exited unexpectedly"
                break
              fi
              if curl -sf --max-time 5 http://localhost:3000/api/templates > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" = true ]; then
              echo "Server is ready!"
              break
            fi

            echo "Server did not become ready in time, killing..."
            kill "$DEV_SERVER_PID" 2>/dev/null || true
            wait "$DEV_SERVER_PID" 2>/dev/null || true
            sleep 2

            if [ "$attempt" -eq 3 ]; then
              echo "Server failed to start after 3 attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run integration tests
        run: bun run test:integration
        env:
          TEST_BASE_URL: 'http://localhost:3000'

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            kill $DEV_SERVER_PID || true
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(bun pm pkg get devDependencies.playwright)
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: '~/.cache/ms-playwright'
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Apply D1 migrations
        run: bun run db:migrate:local

      - name: Start dev server
        run: |
          for attempt in 1 2 3; do
            echo "Starting dev server (attempt $attempt/3)..."
            bun run dev &
            DEV_SERVER_PID=$!
            echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> "$GITHUB_ENV"

            ready=false
            for i in $(seq 1 60); do
              if ! kill -0 "$DEV_SERVER_PID" 2>/dev/null; then
                echo "Dev server process exited unexpectedly"
                break
              fi
              if curl -sf --max-time 5 http://localhost:3000/api/templates > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" = true ]; then
              echo "Server is ready!"
              break
            fi

            echo "Server did not become ready in time, killing..."
            kill "$DEV_SERVER_PID" 2>/dev/null || true
            wait "$DEV_SERVER_PID" 2>/dev/null || true
            sleep 2

            if [ "$attempt" -eq 3 ]; then
              echo "Server failed to start after 3 attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run E2E tests
        id: e2e
        run: |
          xvfb-run --auto-servernum -- bun run test:e2e

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            kill $DEV_SERVER_PID || true
          fi

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            playwright-artifacts/
          if-no-files-found: error
